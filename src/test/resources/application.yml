spring:
  datasource:
    url: jdbc:mysql://localhost:3306/furniture_shop_test
    username: root
    password: admin
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

furnitureshop:
  localization:
    defaultLocale: en-US
    cookieMaxAge: 30
  user:
    maxLoginAttempts: 3
    banDuration: 60
  avatar:
    directory: "avatars/"
    max-file-size: 5MB
  pagination:
    paginationRange: 4
    pageSizes:
      - 5
      - 10
      - 25
      - 100
  orders:
    defaults:
      sortOrder: desc
      sortField: date
  products:
    defaults:
      page: 1
      size: 5
      sortOrder: desc
      sortField: price